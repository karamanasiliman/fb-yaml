                  - $ref: '#/components/schemas/AdSet'
                  - $ref: '#/components/schemas/Ad'
                  - $ref: '#/components/schemas/AdCreative'
                  - $ref: '#/components/schemas/CustomAudience'
                  - $ref: '#/components/schemas/AsyncJobStatus'
                  - $ref: '#/components/schemas/Pixel'
                  - $ref: '#/components/schemas/CustomConversion'
                  - $ref: '#/components/schemas/Catalog'
                  - $ref: '#/components/schemas/OfflineEventSet'
                  - $ref: '#/components/schemas/LeadgenForm'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Campaigns
        - Ad Sets
        - Ads
        - Creatives
        - Audiences
      summary: Update object by ID
      description: >-
        Updates an existing Graph API object by its ID. This operation is only
        supported for certain object types like Campaigns, Ad Sets, Ads,
        Creatives, and Custom Audiences. The required request body depends on
        the object being updated.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the object to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Campaign'
                - $ref: '#/components/schemas/AdSet'
                - $ref: '#/components/schemas/Ad'
                - $ref: '#/components/schemas/AdCreative'
                - $ref: '#/components/schemas/CustomAudience'
      responses:
        '200':
          description: Success indicator
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
    delete:
      tags:
        - Campaigns
        - Ad Sets
        - Ads
        - Audiences
      summary: Delete object by ID
      description: >-
        Deletes a Graph API object by its ID. This operation is only supported
        for certain object types like Campaigns, Ad Sets, Ads, and Custom
        Audiences.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the object to delete.
          schema:
            type: string
      responses:
        '200':
          description: Success indicator
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
webhooks:
  leadgen:
    post:
      summary: Leadgen webhook
      description: >-
        Example webhook for lead generation form submissions from Facebook Pages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object:
                  type: string
                  example: page
                entry:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '1234567890'
                      time:
                        type: integer
                        example: 1723112200
                      changes:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: leadgen
                            value:
                              type: object
                              properties:
                                ad_id:
                                  type: string
                                  example: '2384759834759834'
                                form_id:
                                  type: string
                                  example: '987654321001234'
                                leadgen_id:
                                  type: string
                                  example: '1122334455667788'
                                created_time:
                                  type: integer
                                  example: 1723112200
                                page_id:
                                  type: string
                                  example: '1234567890'
                                adgroup_id:
                                  type: string
                                  example: '2384759834759835'
                                adgroup_name:
                                  type: string
                                  example: Ad Set Name
                                campaign_id:
                                  type: string
                                  example: '2384759834759836'
                                campaign_name:
                                  type: string
                                  example: Campaign Name
      responses:
        '200':
          description: Acknowledge receipt
          content:
            text/plain:
              schema:
                type: string
              example: EVENT_RECEIVED
components:
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supply a Meta access token with required scopes in the Authorization
        header: Authorization: Bearer {access-token}. Typical scopes:
        ads_management, ads_read, business_management,
        pages_read_engagement, pages_manage_metadata, leads_retrieval,
        catalog_management, read_insights, pages_show_list.
  parameters:
    fields:
      name: fields
      in: query
      description: >-
        Comma-separated list of fields to include. Supports nested expansions
        (e.g., fields=name,insights{impressions,spend}).
      required: false
      schema:
        type: string
      example: id,name,status,objective
    limit:
      name: limit
      in: query
      description: Maximum number of results to return (cursor pagination).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 25
      example: 50
    after:
      name: after
      in: query
      description: Cursor pointing to the end of the page of data you have.
      required: false
      schema:
        type: string
      example: QVFIUkhV...
    before:
      name: before
      in: query
      description: Cursor pointing to the start of the page of data you have.
      required: false
      schema:
        type: string
      example: QVFIUmF3...
    time_range:
      name: time_range
      in: query
      description: >-
        Time range for certain endpoints such as Insights. Accepts an object
        serialized as JSON (e.g.,
        {"since":"2024-01-01","until":"2024-01-31"}) or ISO date strings
        depending on endpoint.
      required: false
      schema:
        oneOf:
          - type: string
          - type: object
            properties:
              since:
                type: string
                format: date
              until:
                type: string
                format: date
    date_preset:
      name: date_preset
      in: query
      description: >-
        Preset date ranges for Insights (e.g., today, last_7d, last_30d,
        maximum).
      required: false
      schema:
        type: string
        enum:
          - today
          - yesterday
          - this_month
          - last_month
          - this_quarter
          - lifetime
          - last_3d
          - last_7d
          - last_14d
          - last_28d
          - last_30d
          - last_90d
          - maximum
      example: last_7d
    level:
      name: level
      in: query
      description: Insights aggregation level.
      required: false
      schema:
        type: string
        enum:
          - account
          - campaign
          - adset
          - ad
      example: campaign
    breakdowns:
      name: breakdowns
      in: query
      description: >-
        Comma-separated breakdown dimensions (e.g.,
        age,gender,region,device_platform,placement).
      required: false
      schema:
        type: string
      example: age,gender,region
    time_increment:
      name: time_increment
      in: query
      description: >-
        Time aggregation window for Insights. Use 1 for daily, 7 for weekly,
        or a date string interval like monthly.
      required: false
      schema:
        oneOf:
          - type: string
          - type: integer
      example: 1
    filtering:
      name: filtering
      in: query
      description: >-
        JSON-encoded array of filter specs for Insights (e.g.,
        [{"field":"campaign.id","operator":"IN","value":["123"]}]).
      required: false
      schema:
        type: string
      example: >-
        [{"field":"campaign.id","operator":"IN","value":["120000000000001","120000000000002"]}]
    effective_status:
      name: effective_status
      in: query
      description: >-
        Filter by effective delivery status (e.g., ACTIVE, PAUSED, ARCHIVED,
        DELETED).
      required: false
      schema:
        type: array
        items:
          type: string
          enum:
            - ACTIVE
            - PAUSED
            - ARCHIVED
            - DELETED
            - IN_PROCESS
            - WITH_ISSUES
        uniqueItems: true
      style: form
      explode: true
      example:
        - ACTIVE
        - PAUSED
    status:
      name: status
      in: query
      description: Filter by configured status (varies by resource).
      required: false
      schema:
        type: string
        enum:
          - ACTIVE
          - PAUSED
          - ARCHIVED
          - DELETED
      example: ACTIVE
  schemas:
    AdAccountId:
      type: string
      description: Ad account ID in the format act_<NUM> or numeric ID.
      examples:
        - act_123456789012345
        - '123456789012345'
    CampaignId:
      type: string
      description: Campaign object ID.
      example: '120000000000001'
    AdSetId:
      type: string
      description: Ad Set object ID.
      example: '120000000000101'
    AdId:
      type: string
      description: Ad object ID.
      example: '120000000000201'
    AdCreativeId:
      type: string
      description: Ad Creative object ID.
      example: '120000000000301'
    AudienceId:
      type: string
      description: Audience (Custom/Saved/Lookalike) object ID.
      example: '238000000000401'
    PixelId:
      type: string
      description: Pixel ID.
      example: '123456789012345'
    CatalogId:
      type: string
      description: Commerce Catalog ID.
      example: '123456789012345'
    BusinessId:
      type: string
      description: Business Manager ID.
      example: '123456789012345'
    PageId:
      type: string
      description: Page ID.
      example: '112233445566778'
    FormId:
      type: string
      description: Leadgen form ID.
      example: '987654321098765'
    ProductItemId:
      type: string
      description: Product item ID within Catalog.
      example: SKU-ABC-123
    OfflineEventSetId:
      type: string
      description: Offline event set ID.
      example: '123456789000001'
    ErrorObject:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: integer
        error_subcode:
          type: integer
          nullable: true
        error_user_title:
          type: string
          nullable: true
        error_user_msg:
          type: string
          nullable: true
        fbtrace_id:
          type: string
      required:
        - message
        - type
        - code
        - fbtrace_id
      example:
        message: '(#100) Invalid parameter'
        type: OAuthException
        code: 100
        error_subcode: 33
        error_user_title: Invalid Field
        error_user_msg: Check the requested field names.
        fbtrace_id: ABCD1Ef2Gh3
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
      required:
        - error
    CursorCursors:
      type: object
      properties:
        before:
          type: string
        after:
          type: string
      required: []
      example:
        before: QVFIUmF3...
        after: QVFIUkhV...
    CursorPaging:
      type: object
      description: Cursor-based pagination wrapper returned by Graph API.
      properties:
        data:
          type: array
          items: {}
          description: Array of node objects (type varies by endpoint).
        paging:
          type: object
          properties:
            cursors:
              $ref: '#/components/schemas/CursorCursors'
            previous:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
      example:
        data: []
        paging:
          cursors:
            before: QVFIUmF3...
            after: QVFIUkhV...
          previous: 'https://graph.facebook.com/v23.0/...'
          next: 'https://graph.facebook.com/v23.0/...'
    DeliveryStatus:
      type: string
      enum:
        - ACTIVE
        - PAUSED
        - ARCHIVED
        - DELETED
        - IN_PROCESS
        - WITH_ISSUES
    Objective:
      type: string
      description: Campaign objective.
      enum:
        - OUTCOME_AWARENESS
        - OUTCOME_TRAFFIC
        - OUTCOME_ENGAGEMENT
        - OUTCOME_LEADS
        - OUTCOME_APP_PROMOTION
        - OUTCOME_SALES
        - BRAND_AWARENESS
        - REACH
        - LEAD_GENERATION
        - CONVERSIONS
        - APP_INSTALLS
        - CATALOG_SALES
        - MESSAGES
        - VIDEO_VIEWS
    BillingEvent:
      type: string
      enum:
        - IMPRESSIONS
        - CLICK
        - LINK_CLICKS
        - APP_INSTALLS
        - THRUPLAY
        - REACH
        - POST_ENGAGEMENT
    OptimizationGoal:
      type: string
      enum:
        - NONE
        - REACH
        - IMPRESSIONS
        - LINK_CLICKS
        - LEAD_GENERATION
        - OFFSITE_CONVERSIONS
        - LANDING_PAGE_VIEWS
        - THRUPLAY
        - QUALITY_LEAD
        - VALUE
        - APP_INSTALLS
    AttributionSetting:
      type: string
      description: Attribution window setting for delivery/measurement.
      enum:
        - 1d_click
        - 7d_click
        - 1d_view
        - 7d_click,1d_view
        - 1d_click,1d_view
    GeoLocationRegion:
      type: object
      properties:
        key:
          type: string
          description: Region key, typically numeric string.
      required:
        - key
      example:
        key: '3846'
    GeoLocationCity:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        country:
          type: string
        region:
          type: string
        radius:
          type: string
          description: Radius like "10"
        distance_unit:
          type: string
          enum:
            - mile
            - km
      required:
        - key
      example:
        key: '2420605'
        name: Austin
        country: US
        region: Texas
        radius: '10'
        distance_unit: mile
    GeoLocations:
      type: object
      properties:
        countries:
          type: array
          items:
            type: string
          example:
            - US
            - CA
        regions:
          type: array
          items:
            $ref: '#/components/schemas/GeoLocationRegion'
        cities:
          type: array
          items:
            $ref: '#/components/schemas/GeoLocationCity'
        zips:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
            required:
              - key
        location_types:
          type: array
          items:
            type: string
            enum:
              - home
              - recent
              - travel_in
              - living_in
      example:
        countries:
          - US
        location_types:
          - home
    TargetingInterest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      example:
        id: '6003139266461'
        name: Digital marketing
    TargetingBehavior:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      example:
        id: '6071631541183'
        name: Engaged Shoppers
    Targeting:
      type: object
      description: Ad set targeting spec.
      properties:
        age_min:
          type: integer
          minimum: 13
          example: 25
        age_max:
          type: integer
          maximum: 65
          example: 55
        genders:
          type: array
          items:
            type: integer
            enum:
              - 0
              - 1
              - 2
          description: 0=All, 1=Male, 2=Female
        geo_locations:
          $ref: '#/components/schemas/GeoLocations'
        excluded_geo_locations:
          $ref: '#/components/schemas/GeoLocations'
        interests:
          type: array
          items:
            $ref: '#/components/schemas/TargetingInterest'
        behaviors:
          type: array
          items:
            $ref: '#/components/schemas/TargetingBehavior'
        flexible_spec:
          type: array
          items:
            type: object
            additionalProperties: true
          description: OR groupings of interests/behaviors/demographics.
        exclusions:
          type: object
          additionalProperties: true
        publisher_platforms:
          type: array
          items:
            type: string
            enum:
              - facebook
              - instagram
              - audience_network
              - messenger
        facebook_positions:
          type: array
          items:
            type: string
            enum:
              - feed
              - video_feeds
              - right_hand_column
              - search
        instagram_positions:
          type: array
          items:
            type: string
            enum:
              - stream
              - explore
              - reels
        device_platforms:
          type: array
          items:
            type: string
            enum:
              - mobile
              - desktop
        locales:
          type: array
          items:
            type: integer
      required:
        - geo_locations
      example:
        age_min: 25
        age_max: 55
        genders:
          - 0
        geo_locations:
          countries:
            - US
          location_types:
            - home
        interests:
          - id: '6003139266461'
            name: Digital marketing
        publisher_platforms:
          - facebook
          - instagram
        device_platforms:
          - mobile
          - desktop
    Budget:
      type: object
      properties:
        daily_budget:
          type: string
          pattern: '^[0-9]+$'
          description: Daily budget in the smallest currency unit (e.g., cents).
          example: '5000'
        lifetime_budget:
          type: string
          pattern: '^[0-9]+$'
          description: >-
            Lifetime budget in the smallest currency unit (mutually exclusive
            with daily_budget).
          example: '100000'
      example:
        daily_budget: '5000'
    Bid:
      type: object
      properties:
        bid_amount:
          type: string
          pattern: '^[0-9]+$'
          description: Bid cap or amount in smallest currency unit when applicable.
          example: '200'
        bid_strategy:
          type: string
          enum:
            - LOWEST_COST_WITHOUT_CAP
            - LOWEST_COST_WITH_BID_CAP
            - COST_CAP
            - TARGET_COST
      example:
        bid_strategy: LOWEST_COST_WITHOUT_CAP
    Schedule:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        time_based_ad_rotation_id_blocks:
          type: array
          items:
            type: array
            items:
              type: string
        time_start:
          type: string
          format: date-time
        time_stop:
          type: string
          format: date-time
      example:
        start_time: '2025-08-10T00:00:00Z'
        end_time: '2025-09-10T00:00:00Z'
    AdInsight:
      type: object
      properties:
        date_start:
          type: string
          format: date
        date_stop:
          type: string
          format: date
        account_id:
          type: string
        campaign_id:
          type: string
        adset_id:
          type: string
        ad_id:
          type: string
        impressions:
          type: string
        clicks:
          type: string
        spend:
          type: string
        cpc:
          type: string
        cpm:
          type: string
        ctr:
          type: string
        actions:
          type: array
          items:
            type: object
            properties:
              action_type:
                type: string
              value:
                type: string
      example:
        date_start: '2025-08-01'
        date_stop: '2025-08-07'
        account_id: '123456789012345'
        campaign_id: '120000000000001'
        impressions: '102394'
        clicks: '2134'
        spend: '456.78'
        cpc: '0.21'
        cpm: '4.46'
        ctr: '2.08'
        actions:
          - action_type: link_click
            value: '2134'
    AdAccount:
      type: object
      description: Ad Account node.
      properties:
        id:
          $ref: '#/components/schemas/AdAccountId'
        account_id:
          type: string
          description: Numeric account id without act_ prefix.
          example: '123456789012345'
        name:
          type: string
        currency:
          type: string
          example: USD
        timezone_id:
          type: integer
          example: 1
        timezone_name:
          type: string
          example: America/Los_Angeles
        business:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/BusinessId'
            name:
              type: string
        owner:
          type: string
          description: User ID of the account owner.
          example: '100012345678901'
        amount_spent:
          type: string
          description: Total spent in account currency.
          example: '12345.67'
        balance:
          type: string
          description: Outstanding balance.
          example: '0'
        funding_source_details:
          type: object
          additionalProperties: true
        adtrust_dsl:
          type: integer
          description: Credit line remaining in minor units.
        capabilities:
          type: array
          items:
            type: string
        created_time:
          type: string
          format: date-time
        updated_time:
          type: string
          format: date-time
        effective_status:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStatus'
      example:
        id: act_123456789012345
        account_id: '123456789012345'
        name: Primary Ad Account
        currency: USD
        timezone_id: 1
        timezone_name: America/Los_Angeles
        business:
          id: '123456789012345'
          name: Example Business
        owner: '100012345678901'
        amount_spent: '12345.67'
        balance: '0'
        capabilities:
          - A2C_COMMERCE
        created_time: '2024-01-05T12:00:00Z'
        updated_time: '2025-07-01T12:00:00Z'
        effective_status:
          - ACTIVE
    Campaign:
      type: object
      description: Campaign node.
      properties:
        id:
          $ref: '#/components/schemas/CampaignId'
        account_id:
          type: string
          example: '123456789012345'
        name:
          type: string
        objective:
          $ref: '#/components/schemas/Objective'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        effective_status:
          $ref: '#/components/schemas/DeliveryStatus'
        buying_type:
          type: string
          example: AUCTION
        special_ad_categories:
          type: array
          items:
            type: string
            enum:
              - NONE
              - EMPLOYMENT
              - CREDIT
              - HOUSING
              - SOCIAL_ISSUES_ELECTIONS_POLITICS
        daily_budget:
          type: string
          description: Minor units (e.g., cents).
          example: '5000'
        lifetime_budget:
          type: string
          example: '100000'
        start_time:
          type: string
          format: date-time
        stop_time:
          type: string
          format: date-time
        bid_strategy:
          $ref: '#/components/schemas/Bid/properties/bid_strategy'
        created_time:
          type: string
          format: date-time
        updated_time:
          type: string
          format: date-time
      required:
        - id
        - name
        - objective
      example:
        id: '120000000000001'
        account_id: '123456789012345'
        name: Q3 Awareness
        objective: OUTCOME_AWARENESS
        status: PAUSED
        effective_status: PAUSED
        buying_type: AUCTION
        special_ad_categories:
          - NONE
        daily_budget: '5000'
        start_time: '2025-08-10T00:00:00Z'
        bid_strategy: LOWEST_COST_WITHOUT_CAP
        created_time: '2025-08-01T10:00:00Z'
        updated_time: '2025-08-01T10:00:00Z'
    AdSet:
      type: object
      description: Ad Set node.
      properties:
        id:
          $ref: '#/components/schemas/AdSetId'
        account_id:
          type: string
          example: '123456789012345'
        campaign_id:
          $ref: '#/components/schemas/CampaignId'
        name:
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        effective_status:
          $ref: '#/components/schemas/DeliveryStatus'
        daily_budget:
          type: string
          example: '5000'
        lifetime_budget:
          type: string
          example: '100000'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        billing_event:
          $ref: '#/components/schemas/BillingEvent'
        optimization_goal:
          $ref: '#/components/schemas/OptimizationGoal'
        bid_amount:
          $ref: '#/components/schemas/Bid/properties/bid_amount'
        bid_strategy:
          $ref: '#/components/schemas/Bid/properties/bid_strategy'
        attribution_setting:
          $ref: '#/components/schemas/AttributionSetting'
        targeting:
          $ref: '#/components/schemas/Targeting'
        pacing_type:
          type: array
          items:
            type: string
        promoted_object:
          type: object
          additionalProperties: true
        created_time:
          type: string
          format: date-time
        updated_time:
          type: string
          format: date-time
      required:
        - id
        - campaign_id
        - name
        - optimization_goal
        - billing_event
        - targeting
      example:
        id: '120000000000101'
        account_id: '123456789012345'
        campaign_id: '120000000000001'
        name: Prospecting — US 25-55
        status: PAUSED
        effective_status: PAUSED
        daily_budget: '5000'
        start_time: '2025-08-10T00:00:00Z'
        billing_event: IMPRESSIONS
        optimization_goal: REACH
        bid_strategy: LOWEST_COST_WITHOUT_CAP
        attribution_setting: 7d_click,1d_view
        targeting:
          age_min: 25
          age_max: 55
          geo_locations:
            countries:
              - US
          publisher_platforms:
            - facebook
            - instagram
          device_platforms:
            - mobile
            - desktop
        pacing_type:
          - standard
        created_time: '2025-08-01T10:05:00Z'
        updated_time: '2025-08-01T10:05:00Z'
    Ad:
      type: object
      description: Ad node.
      properties:
        id:
          $ref: '#/components/schemas/AdId'
        account_id:
          type: string
          example: '123456789012345'
        adset_id:
          $ref: '#/components/schemas/AdSetId'
        campaign_id:
          $ref: '#/components/schemas/CampaignId'
        name:
          type: string
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        effective_status:
          $ref: '#/components/schemas/DeliveryStatus'
        creative:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/AdCreativeId'
          required:
            - id
        tracking_specs:
          type: array
          items:
            type: object
            additionalProperties: true
        ad_review_feedback:
          type: object
          additionalProperties: true
        recommendations:
          type: array
          items:
            type: object
            additionalProperties: true
        created_time:
          type: string
          format: date-time
        updated_time:
          type: string
          format: date-time
      required:
        - id
        - adset_id
        - name
        - creative
      example:
        id: '120000000000201'
        account_id: '123456789012345'
        adset_id: '120000000000101'
        campaign_id: '120000000000001'
        name: Primary — Image A
        status: PAUSED
        effective_status: PAUSED
        creative:
          id: '120000000000301'
        created_time: '2025-08-01T10:10:00Z'
        updated_time: '2025-08-01T10:10:00Z'
    LinkData:
      type: object
      properties:
        message:
          type: string
        link:
          type: string
        caption:
          type: string
        name:
          type: string
        description:
          type: string
        picture:
          type: string
        image_hash:
          type: string
          description: Hash from ad image upload.
        call_to_action:
          type: object
          properties:
            type:
              type: string
              example: LEARN_MORE
            value:
              type: object
              properties:
                link:
                  type: string
                lead_gen_form_id:
                  $ref: '#/components/schemas/FormId'
      example:
        message: Discover our latest offer
        link: 'https://www.example.com/sale'
        name: Summer Sale
        description: Up to 50% off
        image_hash: 3c5e1a2b6f9d0e...
        call_to_action:
          type: LEARN_MORE
          value:
            link: 'https://www.example.com/sale'
    ObjectStorySpec:
      type: object
      properties:
        page_id:
          $ref: '#/components/schemas/PageId'
        instagram_actor_id:
          type: string
          description: Connected Instagram actor ID.
          example: '17841400000000000'
        link_data:
          $ref: '#/components/schemas/LinkData'
        video_data:
          type: object
          properties:
            title:
              type: string
            message:
              type: string
            video_id:
