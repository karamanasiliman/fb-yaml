openapi: 3.1.0
info:
  title: Meta Marketing API – Full Surface OpenAPI
  summary: Full-surface OpenAPI for Meta (Facebook) Marketing API.
  version: v23.0
  description: >-
    Comprehensive OpenAPI 3.1 spec covering Meta (Facebook) Marketing API
    v23.0, including ad accounts, campaigns, ad sets, ads, creatives,
    insights, audiences, pixels, catalogs, offline events, pages, business
    assets, async jobs, batch operations, and webhooks.


    ## Authentication

    Use `Authorization: Bearer {access-token}` with a valid User, Page, or
    System User token. Common scopes: `ads_management`, `ads_read`,
    `business_management`, `pages_read_engagement`,
    `pages_manage_metadata`, `leads_retrieval`, `catalog_management`,
    `read_insights`, `pages_show_list`. App review may be required for
    certain permissions.


    ## Graph API Conventions

    - Nodes are objects (e.g., AdAccount, Campaign).

    - Edges are connections (e.g., `/act_{id}/campaigns`).

    - Field selection via `fields` query param; supports nested expansions.

    - Cursor pagination via `limit`, `after`, `before`.


    ## Rate Limiting

    Requests are subject to Meta platform rate limiting (Business and
    App-level). Back off on HTTP 429 and observe `X-App-Usage`,
    `X-Page-Usage`, and `X-Business-Use-Case-Usage` headers when present.


    ## Data Protection

    When creating Custom Audiences with customer data, hash PII (SHA-256)
    client-side where required and ensure GDPR/CCPA compliance.


    ## Errors

    Errors return: `{ error: { message, type, code, error_subcode,
    error_user_title, error_user_msg, fbtrace_id } }`.


    ## Batch & Async

    The Graph Batch API (`POST /?batch=...`) enables multiple operations in a
    single request. Async jobs are provided for large reports (Insights) and
    bulk uploads.
  termsOfService: https://www.facebook.com/legal/terms
  contact:
    name: API Team
    url: https://developers.facebook.com/docs/marketing-apis/
  license:
    name: Meta Platform Terms
servers:
  - url: https://graph.facebook.com/v23.0
    description: Production server pinned to version v23.0.
  - url: https://graph.facebook.com
    description: Versionless server (include version in path, e.g., /v23.0/...).
externalDocs:
  description: Meta Marketing API Documentation
  url: https://developers.facebook.com/docs/marketing-apis/
security:
  - OAuth2Bearer: []
tags:
  - name: Accounts
    description: >-
      Identity & account resources including /me, Users, Ad Accounts,
      Businesses, and Pages.
  - name: Campaigns
    description: Campaign objects and edges on ad accounts.
  - name: Ad Sets
    description: Ad set objects and related edges.
  - name: Ads
    description: Ad objects and management.
  - name: Creatives
    description: Ad creative management including images, videos, and mockups.
  - name: Insights
    description: >-
      Insights and async reporting across account, campaign, ad set, and ad
      levels.
  - name: Audiences
    description: Custom Audiences, Lookalike specs, and targeting search.
  - name: Pixels
    description: Pixels, events, and conversions.
  - name: Conversions
    description: Conversions API (CAPI) and custom conversions.
  - name: Catalogs
    description: Commerce catalogs, products, feeds, and uploads.
  - name: Offline Events
    description: Offline event sets and uploads.
  - name: Lead Ads
    description: Leadgen forms, leads, and related webhooks.
  - name: Business
    description: >-
      Business assets, system users, partners, apps/permissions, and shared
      assets.
  - name: Media
    description: Media endpoints for ad images and video upload flows.
  - name: Diagnostics
    description: Delivery estimates, targeting validation, reach/frequency tooling.
  - name: Batch
    description: Graph API batch operations.
  - name: Utilities
    description: Utilities including search and fields expansion.
  - name: Webhooks
    description: Webhooks event formats and subscription payloads.
paths:
  /:
    post:
      tags:
        - Batch
      summary: Graph API Batch request
      description: >-
        Executes multiple Graph API calls in a single HTTP request using the
        batch parameter.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: batch
          in: query
          required: true
          description: JSON array of individual Graph API requests.
          schema:
            type: string
          example: >-
            [{"method":"GET","relative_url":"me"},{"method":"POST","relative_url":"me/feed","body":"message=Hello"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: Batch response array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                - code: 200
                  headers: []
                  body:
                    id: '123'
                    name: Test Campaign
                - code: 400
                  headers: []
                  body:
                    error:
                      message: Invalid parameter
                      type: OAuthException
                      code: 100
                      fbtrace_id: EJplcsCHuLu
  /me:
    get:
      tags:
        - Accounts
      summary: Get current user profile
      description: >-
        Returns the profile of the current user associated with the access
        token.
      security:
        - OAuth2Bearer: []
      parameters:
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Successful response with user profile data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                id: '100012345678901'
                name: John Doe
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /me/adaccounts:
    get:
      tags:
        - Accounts
      summary: List ad accounts for the current user
      description: Returns the list of ad accounts the user has access to.
      security:
        - OAuth2Bearer: []
      parameters:
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
      responses:
        '200':
          description: List of ad accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
              example:
                data:
                  - id: act_123456789012345
                    account_id: '123456789012345'
                    name: Main Account
                paging:
                  cursors:
                    before: QVFIUmF3...
                    after: QVFIUkhV...
  '/{business_id}/owned_ad_accounts':
    get:
      tags:
        - Accounts
      summary: List ad accounts owned by business
      description: Returns ad accounts owned by the given business.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BusinessId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: List of owned ad accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
  '/{business_id}/system_users':
    get:
      tags:
        - Accounts
        - Business
      summary: List system users for a business
      description: Returns system users associated with the given business.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BusinessId'
        - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: List of system users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
    post:
      tags:
        - Business
      summary: Create system user
      description: Creates a new system user for the specified business.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  type: string
              required:
                - name
                - role
            example:
              name: Marketing API User
              role: ADMIN
      responses:
        '200':
          description: Created system user ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: '543210987654321'
  '/{page_id}/leadgen_forms':
    get:
      tags:
        - Lead Ads
      summary: List leadgen forms for a Page
      description: Returns lead generation forms for a given Page.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PageId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: List of leadgen forms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
    post:
      tags:
        - Lead Ads
      summary: Create leadgen form
      description: Creates a new lead generation form for the specified page.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: page_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                follow_up_action_url:
                  type: string
                questions:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
              required:
                - name
                - questions
            example:
              name: Home Buyer Lead Form
              follow_up_action_url: 'https://example.com/thank-you'
              questions:
                - type: FULL_NAME
                - type: EMAIL
                - type: PHONE
      responses:
        '200':
          description: Created form ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: '987654321001234'
  '/{ad_account_id}/campaigns':
    get:
      tags:
        - Campaigns
      summary: List campaigns
      description: Returns all campaigns in the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/effective_status'
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
    post:
      tags:
        - Campaigns
      summary: Create campaign
      description: Creates a new campaign under the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                objective:
                  $ref: '#/components/schemas/Objective'
                status:
                  $ref: '#/components/schemas/DeliveryStatus'
                special_ad_categories:
                  type: array
                  items:
                    type: string
                daily_budget:
                  type: string
                lifetime_budget:
                  type: string
                start_time:
                  type: string
                  format: date-time
                stop_time:
                  type: string
                  format: date-time
                bid_strategy:
                  $ref: '#/components/schemas/Bid/properties/bid_strategy'
              required:
                - name
                - objective
                - status
            example:
              name: Q4 Awareness
              objective: OUTCOME_AWARENESS
              status: PAUSED
              daily_budget: '5000'
      responses:
        '200':
          description: Created campaign ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: '120000000000001'
  '/{campaign_id}/insights':
    get:
      tags:
        - Insights
      summary: Get campaign insights
      description: Returns insights for the specified campaign.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CampaignId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/time_range'
        - $ref: '#/components/parameters/date_preset'
        - $ref: '#/components/parameters/level'
        - $ref: '#/components/parameters/breakdowns'
        - $ref: '#/components/parameters/time_increment'
        - $ref: '#/components/parameters/filtering'
      responses:
        '200':
          description: Insights data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdInsight'
  '/{ad_account_id}/adsets':
    get:
      tags:
        - Ad Sets
      summary: List ad sets
      description: Returns all ad sets in the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/effective_status'
      responses:
        '200':
          description: List of ad sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
    post:
      tags:
        - Ad Sets
      summary: Create ad set
      description: Creates a new ad set in the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                campaign_id:
                  $ref: '#/components/schemas/CampaignId'
                status:
                  $ref: '#/components/schemas/DeliveryStatus'
                daily_budget:
                  type: string
                lifetime_budget:
                  type: string
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
                billing_event:
                  $ref: '#/components/schemas/BillingEvent'
                optimization_goal:
                  $ref: '#/components/schemas/OptimizationGoal'
                bid_amount:
                  type: string
                bid_strategy:
                  $ref: '#/components/schemas/Bid/properties/bid_strategy'
                attribution_setting:
                  $ref: '#/components/schemas/AttributionSetting'
                targeting:
                  $ref: '#/components/schemas/Targeting'
              required:
                - name
                - campaign_id
                - status
                - optimization_goal
                - billing_event
                - targeting
            example:
              name: Prospecting US 25-55
              campaign_id: '120000000000001'
              status: PAUSED
              daily_budget: '5000'
              billing_event: IMPRESSIONS
              optimization_goal: REACH
              targeting:
                age_min: 25
                age_max: 55
                geo_locations:
                  countries:
                    - US
                publisher_platforms:
                  - facebook
                  - instagram
                device_platforms:
                  - mobile
                  - desktop
      responses:
        '200':
          description: Created ad set ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: '120000000000101'
  '/{adset_id}/insights':
    get:
      tags:
        - Insights
      summary: Get ad set insights
      description: Returns insights for the specified ad set.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: adset_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdSetId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/time_range'
        - $ref: '#/components/parameters/date_preset'
        - $ref: '#/components/parameters/level'
        - $ref: '#/components/parameters/breakdowns'
        - $ref: '#/components/parameters/time_increment'
        - $ref: '#/components/parameters/filtering'
      responses:
        '200':
          description: Insights data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdInsight'
  '/{ad_account_id}/ads':
    get:
      tags:
        - Ads
      summary: List ads
      description: Returns all ads in the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/effective_status'
      responses:
        '200':
          description: List of ads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
    post:
      tags:
        - Ads
      summary: Create ad
      description: Creates a new ad under the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                adset_id:
                  $ref: '#/components/schemas/AdSetId'
                creative:
                  type: object
                  properties:
                    creative_id:
                      $ref: '#/components/schemas/AdCreativeId'
                  required:
                    - creative_id
                status:
                  $ref: '#/components/schemas/DeliveryStatus'
              required:
                - name
                - adset_id
                - creative
                - status
            example:
              name: Image Ad A
              adset_id: '120000000000101'
              creative:
                creative_id: '120000000000301'
              status: PAUSED
      responses:
        '200':
          description: Created ad ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: '120000000000201'
  '/{ad_id}/insights':
    get:
      tags:
        - Insights
      summary: Get ad insights
      description: Returns insights for the specified ad.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/time_range'
        - $ref: '#/components/parameters/date_preset'
        - $ref: '#/components/parameters/level'
        - $ref: '#/components/parameters/breakdowns'
        - $ref: '#/components/parameters/time_increment'
        - $ref: '#/components/parameters/filtering'
      responses:
        '200':
          description: Insights data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdInsight'
  '/{ad_account_id}/adcreatives':
    get:
      tags:
        - Creatives
      summary: List ad creatives
      description: Returns all ad creatives in the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
      responses:
        '200':
          description: List of ad creatives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaging'
    post:
      tags:
        - Creatives
      summary: Create ad creative
      description: Creates a new ad creative in the specified ad account.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                object_story_spec:
                  $ref: '#/components/schemas/ObjectStorySpec'
                asset_feed_spec:
                  type: object
                template_url:
                  type: string
                url_tags:
                  type: string
              required:
                - name
                - object_story_spec
            example:
              name: Link Post Creative
              object_story_spec:
                page_id: '112233445566778'
                link_data:
                  message: Check out our offer
                  link: 'https://www.example.com'
                  image_hash: abc123...
      responses:
        '200':
          description: Created ad creative ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: '120000000000301'
  '/{ad_account_id}/adimages':
    post:
      tags:
        - Media
      summary: Upload ad image
      description: Uploads an image for use in ad creatives.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  format: binary
              required:
                - filename
      responses:
        '200':
          description: Uploaded image hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        hash:
                          type: string
              example:
                images:
                  product.jpg:
                    hash: 3c5e1a2b6f9d0e...
  '/{ad_account_id}/advideos':
    post:
      tags:
        - Media
      summary: Upload video (start/finish)
      description: >-
        Initiates an upload session for a video (upload_phase: start) or
        completes it (upload_phase: finish).
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AdAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    upload_phase:
                      type: string
                      enum:
                        - start
                    file_size:
                      type: integer
                      description: Size in bytes
                  required:
                    - upload_phase
                    - file_size
                  example:
                    upload_phase: start
                    file_size: 1048576
                - type: object
                  properties:
                    upload_phase:
                      type: string
                      enum:
                        - finish
                    upload_session_id:
                      type: string
                  required:
                    - upload_phase
                    - upload_session_id
                  example:
                    upload_phase: finish
                    upload_session_id: '1234567890'
      responses:
        '200':
          description: >-
            Response for start or finish phase. See examples for details on
            each.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      upload_session_id:
                        type: string
                      video_id:
                        type: string
                      start_offset:
                        type: string
                      end_offset:
                        type: string
                      upload_url:
                        type: string
                  - type: object
                    properties:
                      success:
                        type: boolean
                      video_id:
                        type: string
              examples:
                start_phase:
                  summary: Response for start phase
                  value:
                    upload_session_id: '1234567890'
                    video_id: '2345678901'
                    start_offset: '0'
                    end_offset: '1048576'
                    upload_url: 'https://video-upload.facebook.com/api/...'
                finish_phase:
                  summary: Response for finish phase
                  value:
                    success: true
                    video_id: '2345678901'
    put:
      tags:
        - Media
      summary: Transfer video upload chunk
      description: Transfers a chunk of a video to the upload session.
      security:
        - OAuth2Bearer: []
      parameters:
        - name: ad_account_id
